<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="black">
    <meta name="description" content="Iris and John's wedding website.">
    <title>Iris &amp; John</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"></script>
    <script>
      // Decide the entered/gated state before first paint so a returning
      // visitor lands straight on the revealed hero with the nav already in
      // place — no flash, no replay, and no reveal delay.
      if (sessionStorage.getItem("iris-entered")) {
        document.documentElement.classList.add("entered", "chrome-in");
      }
    </script>
  </head>
  <body class="page--hero" hx-boost="true">
    <audio id="soundtrack" src="song.mp3" loop preload="auto" hx-preserve="true"></audio>

    <nav class="topbar" aria-label="Wedding navigation">
      <div class="nav-group nav-group--left">
        <a class="nav-link" href="story.html">Story</a>
        <a class="nav-link" href="details.html">Details</a>
      </div>
      <div class="wordmark"></div>
      <!-- <a class="wordmark" href="index.html">Iris <span class="amp">&amp;</span> John</a> -->
      <div class="nav-group nav-group--right">
        <a class="nav-link" href="registry.html">Registry</a>
        <a class="nav-link" href="rsvp.html">RSVP</a>
      </div>
    </nav>

    <main class="scene scene--hero video-wrapper vhs-video">
      <video class="hero-video" src="Untitled5.mp4" muted loop playsinline autoplay></video>
      <div class="hero-veil" aria-hidden="true"></div>
      <div class="hero-inner">
        <h1 class="hero-name">Iris <span class="amp">&amp;</span> John</h1>
        <div class="hero-cue">
          <button class="enter-button" type="button" id="enterButton">Click to Enter</button>
        </div>
      </div>
    </main>

    <nav class="mobile-menu" id="mobileMenu" aria-label="Wedding navigation">
      <div class="mobile-menu-panel">
        <a class="mm-item is-active" href="index.html"><span class="mm-label">home</span></a>
        <a class="mm-item" href="story.html"><span class="mm-label">story</span></a>
        <a class="mm-item" href="details.html"><span class="mm-label">details</span></a>
        <a class="mm-item" href="registry.html"><span class="mm-label">registry</span></a>
        <!-- <a class="mm-item" href="photos.html"><span class="mm-label">photos</span></a> -->
        <a class="mm-item" href="rsvp.html"><span class="mm-label">rsvp</span></a>
      </div>
      <button class="mm-toggle" type="button" id="mobileMenuToggle" aria-expanded="false" aria-label="Menu">
        <span class="mm-toggle-bars" aria-hidden="true"></span>
      </button>
    </nav>

<!--     <a class="gallery-trigger" href="photos.html" aria-label="Open photo gallery">
      <span>Photos</span>
    </a> -->
