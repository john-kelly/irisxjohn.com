        <a class="nav-link" href="rsvp.html">RSVP</a>
      </div>

    <main class="scene scene--rsvp">
      <div class="panel-inner panel-inner--narrow rsvp">
        <!-- <p class="kicker">RSVP</p> -->
        <p class="display">Will you join us?</p>

        <!-- Step 1 — find your invitation -->
        <div class="rsvp-search" id="rsvpSearch">
          <form class="rsvp-combo" id="rsvpSearchForm" role="search" hx-boost="false" action="rsvp.html">
            <input
              id="rsvpSearchInput"
              class="rsvp-input"
              type="text"
              autocomplete="off"
              autocapitalize="words"
              spellcheck="false"
              enterkeyhint="go"
              placeholder="Start typing your name…"
              role="combobox"
              aria-expanded="false"
              aria-autocomplete="list"
              aria-controls="rsvpResults">
            <!-- Off-screen submit control. iOS Safari only fires its keyboard
                 "go" key when a real submit button exists and isn't display:none. -->
            <button type="submit" class="rsvp-go" tabindex="-1" aria-hidden="true">Go</button>
            <ul class="rsvp-results" id="rsvpResults" role="listbox" hidden></ul>
          </form>
          <p class="rsvp-hint" id="rsvpHint" role="status" aria-live="polite"></p>
        </div>

        <!-- Step 2 — the invitation (filled in by rsvp.js) -->
        <form class="rsvp-invite" id="rsvpInvite" hx-boost="false" hidden>
          <h2 class="rsvp-invite-title" id="rsvpInviteTitle"></h2>
          <p class="rsvp-invite-cue">Check everyone who's coming. Leave anyone who can't make it unchecked.</p>
          <ul class="guest-list" id="guestList"></ul>
          <div class="rsvp-actions">
            <button type="submit" class="rsvp-save" id="rsvpSave">Save RSVP</button>
            <button type="button" class="rsvp-restart" id="rsvpRestart">Not you? Search again</button>
          </div>
          <p class="rsvp-status" id="rsvpStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </main>
